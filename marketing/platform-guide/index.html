  html, body { margin: 0; height: 100%; background: #111; overflow: hidden; }

  .plate { position: absolute; inset: 0; width: 1600px; height: 900px; object-fit: fill; }
  .mark {
    position: absolute; width: 22px; height: 22px; margin: -11px 0 0 -11px;
    z-index: 3; pointer-events: none; opacity: 0;

  .mark svg { display: block; width: 100%; height: 100%; }
  #cursor {
    position: absolute; left: 0; top: 0; width: 28px; height: 28px; z-index: 6;
    pointer-events: none; transform-origin: 5px 3px;
    filter: drop-shadow(0 1px 1px rgba(0,0,0,.35));
  }
  #ripple {
    position: absolute; width: 22px; height: 22px; margin: -11px 0 0 -11px;
    border: 1.5px solid #161616; border-radius: 99px; z-index: 5;

const FILM = 180;

const marks = document.getElementById("marks");
KEYS.forEach((key) => {
  if (key.click < 2) return;
  const size = key.click === 3 ? 12 : 22;
  const el = document.createElement("div");
  el.className = "mark";
  el.style.width = size + "px";
  el.style.height = size + "px";
  el.style.margin = (-size / 2) + "px 0 0 " + (-size / 2) + "px";
  el.style.left = key.cx + "px";
  el.style.top = key.cy + "px";
  el.innerHTML = '<svg viewBox="0 0 24 24"><path d="M5 12.5 L10 17.5 L19.5 7" fill="none" stroke="#161616" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  marks.appendChild(el);
  key.mark = el;
});

function smoother(p) {
  p = Math.max(0, Math.min(1, p));
  return p * p * p * (p * (p * 6 - 15) + 10);
}
function idxAt(t) {
  let i = 0;
  while (i < KEYS.length - 1 && KEYS[i + 1].t <= t) i++;
  return i;
}
function place(x, y, s) {
  let tx = 800 - x * s;
  let ty = 450 - y * s;
  tx = Math.min(0, Math.max(1600 * (1 - s), tx));
  ty = Math.min(0, Math.max(900 * (1 - s), ty));
  return { tx, ty, s };
}
function hand(a, b, p) {
  const dx = b.cx - a.cx;
  const dy = b.cy - a.cy;
  const len = Math.hypot(dx, dy);
  const bend = len < 90 ? 0 : Math.min(18, len * 0.045);
  const mx = (a.cx + b.cx) / 2 - (dy / (len || 1)) * bend;
  const my = (a.cy + b.cy) / 2 + (dx / (len || 1)) * bend;
  const u = 1 - p;
  return {
    x: u * u * a.cx + 2 * u * p * mx + p * p * b.cx,
    y: u * u * a.cy + 2 * u * p * my + p * p * b.cy
  };
}

const world = document.getElementById("world");
const A = document.getElementById("a");
const B = document.getElementById("b");
const cursor = document.getElementById("cursor");
const ripple = document.getElementById("ripple");
Object.values(SRC).forEach((src) => { const im = new Image(); im.src = src; });

function view(t) {
  const i = idxAt(t);
  const a = KEYS[i];
  const b = KEYS[i + 1];
  const prev = i > 0 ? KEYS[i - 1] : null;
  const local = t - a.t;
  const pageIn = !!(prev && a.img !== prev.img);
  let x = a.x;
  let y = a.y;
  let s = a.s;
  if (b && b.img === a.img) {
    const dur = b.t - a.t;
    const hold = pageIn ? 0.22 : 0;
    const moveDur = Math.min(1.8, Math.max(0.45, (dur - hold) * 0.8));
    const p = smoother(Math.min(1, Math.max(0, (local - hold) / moveDur)));
    x = a.x + (b.x - a.x) * p;
    y = a.y + (b.y - a.y) * p;
    s = a.s + (b.s - a.s) * p;
  }
  let cur = { x: a.cx, y: a.cy };
  if (b && b.img === a.img) {
    const dur = b.t - a.t;
    const dist = Math.hypot(b.cx - a.cx, b.cy - a.cy);
    const moveDur = Math.min(1.15, Math.max(0.42, dist / 780));
    const begin = Math.max(0, dur - moveDur - (b.click ? 0.14 : 0.04));
    cur = hand(a, b, smoother(Math.min(1, Math.max(0, (local - begin) / moveDur))));
  }
  let op = 1;
  if (pageIn) op = smoother(Math.min(1, Math.max(0, (local - 0.08) / 0.22)));
  if (b && b.img !== a.img) {
    const remain = b.t - t;
    if (remain < 0.12) op = Math.min(op, Math.max(0, remain / 0.12));
  }
  return { cam: place(x, y, s), cur, img: a.img, op };
}

function apply(t) {
  const v = view(Math.max(0, Math.min(FILM, t)));
  const src = SRC[v.img];
  if (B.getAttribute("data-src") !== src) {
    const previous = B.getAttribute("data-src") || src;
    A.setAttribute("data-src", previous);
    A.src = previous;
    B.setAttribute("data-src", src);
    B.src = src;
    B.setAttribute("data-t", String(t));
  }
  const age = t - parseFloat(B.getAttribute("data-t") || "0");
  const same = A.getAttribute("data-src") === B.getAttribute("data-src");
  const fade = same ? 1 : smoother(Math.min(1, Math.max(0, age / 0.12)));
  A.style.opacity = String(1 - fade);
  B.style.opacity = String(fade);
  A.style.transform = "none";
  B.style.transform = "none";
  const cam = v.cam;
  world.style.transform = "translate(" + cam.tx.toFixed(2) + "px," + cam.ty.toFixed(2) + "px) scale(" + cam.s.toFixed(4) + ")";
  const sx = cam.tx + v.cur.x * cam.s;
  const sy = cam.ty + v.cur.y * cam.s;
  let press = 1;
  let rip = null;
  for (let n = KEYS.length - 1; n >= 0; n--) {
    const key = KEYS[n];
    if (key.t > t) continue;
    if (key.click && t - key.t < 0.45) {
      rip = key;
      if (t - key.t < 0.1) press = 0.86;
    }
    break;
  }
  cursor.style.opacity = String(v.op);
  cursor.style.transform = "translate(" + (sx - 5).toFixed(1) + "px," + (sy - 3).toFixed(1) + "px) scale(" + press + ")";
  if (rip) {
    const ageR = t - rip.t;
    const rx = cam.tx + rip.cx * cam.s;
    const ry = cam.ty + rip.cy * cam.s;
    ripple.style.opacity = String(Math.max(0, 1 - ageR / 0.4) * v.op);
    ripple.style.transform = "translate(" + rx.toFixed(1) + "px," + ry.toFixed(1) + "px) scale(" + (0.4 + ageR * 4.2).toFixed(2) + ")";
  } else ripple.style.opacity = "0";
  for (let n = 0; n < KEYS.length; n++) {
    const key = KEYS[n];
    if (!key.mark) continue;
    const on = v.img === key.img && t >= key.t;
    if (!on) { key.mark.style.opacity = "0"; continue; }
    const born = Math.min(1, (t - key.t) / 0.12);
    key.mark.style.opacity = String(smoother(born));
    key.mark.style.transform = "scale(" + (0.7 + 0.3 * smoother(born)).toFixed(3) + ")";
  }
}

const stage = document.getElementById("stage");
const exporting = new URLSearchParams(location.search).has("export");
function fit() {
  if (exporting) { stage.style.transform = "none"; stage.style.left = "0"; stage.style.top = "0"; return; }
  const sc = Math.min(innerWidth / 1600, innerHeight / 900);
  stage.style.transform = "scale(" + sc + ")";
  stage.style.left = ((innerWidth - 1600 * sc) / 2) + "px";
  stage.style.top = ((innerHeight - 900 * sc) / 2) + "px";
}
addEventListener("resize", fit);
fit();
window.renderAt = (t) => apply(Math.max(0, Math.min(FILM, t)));
window.FILM = FILM;
const q = new URLSearchParams(location.search);
if (q.has("t")) renderAt(parseFloat(q.get("t")) || 0);
else if (q.has("scrub") || q.has("export")) renderAt(0);
else {
  const t0 = performance.now();
  const loop = (now) => {
    const elapsed = (now - t0) / 1000;
    if (elapsed < FILM) { apply(elapsed); requestAnimationFrame(loop); }
    else apply(FILM);
  };
  requestAnimationFrame(loop);
}
